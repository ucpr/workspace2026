version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ucpr/workspace2026/dd-trace-go-with-otlp/gen
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative
